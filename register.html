<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Lost & Found</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }
    .register-container {
      background: #fff;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .register-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }
    .register-container input, .register-container select {
      width: 100%;
      padding: 12px;
      margin: 10px 0 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }
    .gender-group {
      display: flex;
      gap: 20px;
      align-items: center;
      margin: 10px 0 15px;
    }
    .gender-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: normal;
      cursor: pointer;
    }
    .gender-group input {
      width: auto;
      margin: 0;
    }
    .register-container button {
      width: 100%;
      padding: 15px;
      background: #0a3d62;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .register-container button:hover { background: #08324a; }
    .register-container .links {
      text-align: center;
      margin-top: 15px;
    }
    .register-container .links a {
      color: #0a3d62;
      text-decoration: none;
    }
    .register-container .links a:hover { text-decoration: underline; }
    .msg {
      text-align: center;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
    .msg.error   { background: #fdecea; color: #c0392b; }
    .msg.success { background: #eafaf1; color: #27ae60; }
    #strengthBar {
      height: 5px;
      border-radius: 3px;
      margin-top: -10px;
      margin-bottom: 15px;
      transition: all 0.3s;
      background: #eee;
    }
    #strengthText {
      font-size: 12px;
      margin-bottom: 10px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Create an Account</h2>
    <div id="msgBox" class="msg"></div>
    <form action="backend/register.php" method="POST" id="registerForm">
      <input type="text" id="full_name" name="full_name" placeholder="Full Name" required>
      <input type="email" id="email" name="email" placeholder="Email" required>
      <div class="gender-group">
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female" required> Female</label>
      </div>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <div id="strengthBar"></div>
      <small id="strengthText"></small>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
    <div class="links">
      <a href="login.html">Already have an account? Login here</a>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const msgBox = document.getElementById('msgBox');
      if (params.has('error')) {
        msgBox.textContent = params.get('error');
        msgBox.classList.add('error');
        msgBox.style.display = 'block';
      }
    });
    // Password strength indicator
    document.getElementById('password').addEventListener('input', function() {
      const val  = this.value;
      const bar  = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');
      if (val.length === 0) {
        bar.style.background = '#eee';
        bar.style.width = '0%';
        text.textContent = '';
      } else if (val.length < 6) {
        bar.style.background = '#e74c3c';
        bar.style.width = '33%';
        text.textContent = 'Weak';
      } else if (val.length < 10) {
        bar.style.background = '#f39c12';
        bar.style.width = '66%';
        text.textContent = 'Medium';
      } else {
        bar.style.background = '#27ae60';
        bar.style.width = '100%';
        text.textContent = 'Strong';
      }
    });
    // Client-side validation
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      const password = document.getElementById('password').value.trim();
      const confirm  = document.getElementById('confirm_password').value.trim();
      const msgBox   = document.getElementById('msgBox');
      if (password.length < 6) {
        e.preventDefault();
        msgBox.textContent = 'Password must be at least 6 characters.';
        msgBox.className = 'msg error';
        msgBox.style.display = 'block';
        return;
      }
      if (password !== confirm) {
        e.preventDefault();
        msgBox.textContent = 'Passwords do not match.';
        msgBox.className = 'msg error';
        msgBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
