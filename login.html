<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Lost & Found</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .login-container {
      background: #fff;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .login-container button {
      width: 100%;
      padding: 15px;
      background: #0a3d62;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .login-container button:hover { background: #08324a; }

    .login-container .links {
      text-align: center;
      margin-top: 15px;
    }

    .login-container .links a {
      color: #0a3d62;
      text-decoration: none;
      margin: 0 5px;
    }

    .login-container .links a:hover { text-decoration: underline; }

    
    .msg {
      text-align: center;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
    .msg.error   { background: #fdecea; color: #c0392b; }
    .msg.success { background: #eafaf1; color: #27ae60; }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login to Lost & Found</h2>

    
    <div id="msgBox" class="msg"></div>

   
    <form action="backend/login.php" method="POST" id="loginForm">
      <input type="email" id="email" name="email" placeholder="Email" required>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="links">
      
      <a href="register.html">Don't have an account? Sign Up</a>
    </div>
  </div>

  <script>
   
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);
      const msgBox = document.getElementById('msgBox');

      if (params.has('error')) {
        msgBox.textContent = params.get('error');
        msgBox.classList.add('error');
        msgBox.style.display = 'block';
      }

      if (params.has('success')) {
        msgBox.textContent = 'Registration successful! Please log in.';
        msgBox.classList.add('success');
        msgBox.style.display = 'block';
      }

      
      if (params.get('msg') === 'logged_out') {
        msgBox.textContent = 'You have been logged out successfully.';
        msgBox.classList.add('success');
        msgBox.style.display = 'block';
      }
    });

    
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) {
        e.preventDefault();
        const msgBox = document.getElementById('msgBox');
        msgBox.textContent = 'Please fill in all fields.';
        msgBox.className = 'msg error';
        msgBox.style.display = 'block';
      }
    });
  </script>

</body>
</html>
